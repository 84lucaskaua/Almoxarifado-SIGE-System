<!-- index.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>SIGE - Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="centro">

    <img  src="img/Senac_logo.svg.png" class="imagem" alt="Logo do SIGE" class="logo">
    <h1>SIGE</h1>
    <p>Sistema de Gerenciamento de Estoque</p>

    <div class="caixa">

      <label>Email</label>
      <input type="email" id="email" placeholder="seu@email.com">

      <label>Senha</label>
      <input type="password" id="senha" placeholder="••••••••">

      <button onclick="login()">Entrar</button>

      <div class="info">
        <p><b>Conta padrão:</b> admin@sige.com</p>
        <p><b>Senha:</b> admin123</p>
      </div>

    </div>

  </div>

  <script src="js/js.js"></script>
</body>
</html>
