version: '3.8'

services:
  db:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sige
      MYSQL_USER: sige
      MYSQL_PASSWORD: sige
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"

  php:
    image: php:8.2-fpm
    volumes:
      - ./backend:/var/www/html
    working_dir: /var/www/html
    depends_on:
      - db

  nginx:
    image: nginx:stable
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html:cached
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  composer:
    image: composer:2
    volumes:
      - ./backend:/app
    working_dir: /app

  node:
    image: node:18
    volumes:
      - ./frontend:/usr/src/app
    working_dir: /usr/src/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    restart: unless-stopped

volumes:
  db_data:
